[project]
name = "earnings-agent"
version = "0.1.0"
description = "Earnings analysis multi-agent on Claude Agent SDK (learning project, phase 2)"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
